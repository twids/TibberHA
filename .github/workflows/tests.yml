name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q custom_components
      - run: python -m pytest -q tests
  ha-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exercise actual HA automation engine without network access
        run: >-
          docker run --rm --network none
          -v "$GITHUB_WORKSPACE:/project:ro"
          --entrypoint python
          ghcr.io/home-assistant/home-assistant:2026.10.2
          /project/tools/verify_ha_engine.py
